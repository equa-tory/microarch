# microarch: frpc client config, ships disabled (frpc.service is not enabled).
# All [[proxies]] below are commented out for safety.
# Start it with: systemctl enable --now frpc

# FRP Client Configuration

serverAddr = "equatory.ddns.net"
serverPort = 10801

# Authentication (must match server)
auth.token = "karamba_trophey"

# MINECRAFT TCP LAG FIX
transport.protocol = "quic"
transport.quic.keepalivePeriod = 10
transport.quic.maxIdleTimeout = 30
transport.quic.maxIncomingStreams = 100000

# Optional logging
log.level = "info"

